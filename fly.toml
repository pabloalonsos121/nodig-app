# Fly.io deploy config for Nodig.
# `fly launch` may rename the app (names are globally unique on Fly); if it
# does, keep the generated name here. See the "Deploy to Fly.io" section of
# README.md for the full step-by-step.

app = "nodig-app"
primary_region = "cdg"  # Paris — close to Belgium; must match the volume region

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # SQLite file lives on the mounted persistent volume so data survives restarts.
  DATABASE_PATH = "/data/nodig.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Persistent volume for the SQLite database. Create it once with:
#   fly volumes create nodig_data --size 1 --region cdg
[[mounts]]
  source = "nodig_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
